<html>
    <head>
        <title>Personal Profile</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
        <!-- Link to external CSS file -->
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        
        <div class="container">
            
            <div class="header">
                <h1>Personal Profile</h1>
                <p>Please fill in your personal information below</p>
            </div>
        
             <form action="ProfileServlet" method="post">
             <div class="form-stack">
                
                <!-- Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                
                <!-- Student ID -->
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="studentId" placeholder="Enter your student ID" required>
                </div>
                
                <!-- Programme -->
                <div class="form-group">
                    <label for="programme">Programme</label>
                    <input type="text" id="programme" name="programme" placeholder="Enter your programme" required>
                </div>
                
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>
                
                <!-- Hobbies -->
                <div class="form-group">
                    <label for="hobbies">Hobbies</label>
                    <textarea id="hobbies" name="hobbies" rows="1" placeholder="Enter your hobbies (e.g. Travelling, Gaming, Reading)" required></textarea>
                </div>
                
                <!-- Self Introduction -->
                <div class="form-group">
                    <label for="introduction">Short Self Introduction</label>
                    <textarea id="introduction" name="introduction" rows="2" placeholder="Please share a little about yourself" required></textarea>
                </div>
                
                
                <!-- Submit Button -->
                <button type="submit">Submit Your Profile</button>
             </div>
            </form>     
        </div>
    </body>
</html>
